inherit: qwen_recipe_7b.yaml
# R13 arm — Qwen2.5-VL-32B-Instruct (Apache-2.0, 68 GB bf16): a different generation from our Qwen3-VL-32B,
# for ensemble diversity. Same recipe/code path as the Qwen2.5-7B models. Fold 0 held out so its val n-best
# scores it; no test pseudo-labels; 2 epochs; no in-training validation.
model:
  id: Qwen/Qwen2.5-VL-32B-Instruct

data:
  pseudo_csv: null

train:
  epochs: 2
  skip_val: true

output:
  dir: runs_checkpoint/qwen25vl32b_r13
  checkpoint_dir: runs_checkpoint/qwen25vl32b_r13_checkpoints
